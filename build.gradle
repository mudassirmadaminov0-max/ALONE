plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven { name = "MeteorDev"; url = "https://maven.meteordev.org/releases/" }
}

def osName = System.getProperty("os.name").toLowerCase()
def nativeClassifier = osName.contains("windows") ? "natives-windows"
		: osName.contains("mac") ? "natives-macos"
		: "natives-linux"

loom {
	runs {
		client {
			// classes were produced without StackMapTable frames
			vmArg "-XX:+UnlockDiagnosticVMOptions"; vmArg "-XX:-BytecodeVerificationRemote"
			vmArg "-Xmx2G"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// the deobfuscated Javelin build (nested libs are loaded by Fabric from META-INF/jars)
	localRuntime files("libs/javelin-run.jar", "libs/crm-native.jar", "libs/authlib-compat.jar")

	// libs that the original project bundled
	localRuntime "org.lwjgl:lwjgl-nanovg:3.3.3"
	localRuntime "org.lwjgl:lwjgl-nanovg:3.3.3:${nativeClassifier}"
	localRuntime "meteordevelopment:discord-ipc:1.1"
	// lwjgl core 3.4.1 plain jar is not cached; use the cached unsafe build + natives directly
	localRuntime files("libs/lwjgl/lwjgl-3.4.1-unsafe.jar", "libs/lwjgl/lwjgl-3.4.1-${nativeClassifier}.jar")
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

configurations.configureEach {
	resolutionStrategy.eachDependency { d ->
		def g = d.requested.group, n = d.requested.name
		if (g == 'com.mojang' && n == 'brigadier') d.useVersion('1.3.11')
		else if (g == 'com.mojang' && n == 'jtracy') d.useVersion('1.14.38')
		else if (g == 'io.netty') d.useVersion('4.2.16.Final')
		else if (g == 'org.joml') d.useVersion('1.10.9')
	}
}


configurations.configureEach { exclude group: 'org.lwjgl', module: 'lwjgl'; exclude group: 'com.mojang', module: 'authlib' }




